name: refine-json
region: eu-central-1
services:
    databases:
        - name: demo
            region: eu-central-1
            type: postgres-neon
    authentication:
        database:
            name: demo
            region: eu-central-1
        providers:
            email: true
        settings:
            passwordReset:
                redirectURL: https://${{frontend.subdomain}}.dev.app.genez.io/reset-password
backend:
    path: server
    language:
        name: ts
        packageManager: npm
    scripts:
        deploy: npm install
        local: npm install
frontend:
    environment:
        VITE_AUTHENTICATION_REGION: ${{ services.authentication.region }}
        VITE_AUTHENTICATION_TOKEN: ${{ services.authentication.token }}
    path: client
    sdk:
        language: ts
    publish: dist
    scripts:
        deploy:
            - npm install @genezio-sdk/${{projectName}}@1.0.0-${{stage}}
            - npm install
        build: npm run build
        start:
            - npm install --silent
            - npm run dev --silent
yamlVersion: 2

