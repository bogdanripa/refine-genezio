backend:
    language:
        name: ts
        packageManager: npm
    path: server
    scripts:
        deploy: npm install
        local: npm install
frontend:
    path: client
    publish: dist
    scripts:
        build: npm run build
        deploy:
            - npm install @genezio-sdk/${{projectName}}@1.0.0-${{stage}}
            - npm install
        start:
            - npm install --silent
            - npm run dev --silent
    sdk:
        language: ts
    subdomain: gold-continuing-bandicoot
name: refine-postgres
region: eu-central-1
services:
    authentication:
        database:
            name: demo
            region: eu-central-1
        providers:
            email: true
    databases:
        - name: demo
          region: eu-central-1
          type: postgres-neon
yamlVersion: 2
